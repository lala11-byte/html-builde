server:
  port: 8083

spring:
  application:
    name: htmlbuilder-generator-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/generator_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql

# DeepSeek-v4-pro API 配置（通过网关调用）
deepseek:
  api-key: ${TOKENHUB_API_KEY:}
  base-url: http://192.200.1.213:18086/v1/messages
  model: deepseek-v4-pro