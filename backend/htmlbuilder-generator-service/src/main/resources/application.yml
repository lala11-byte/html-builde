server:
  port: 8083

spring:
  application:
    name: htmlbuilder-generator-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/generator_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql

# DeepSeek API 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}