server:
  port: 8080

spring:
  application:
    name: htmlbuilder-gateway-service
  cloud:
    nacos:
      discovery:
        enabled: false
        server-addr: 127.0.0.1:8848
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - 'http://localhost:5173'
              - 'http://localhost:5174'
              - 'http://localhost:3000'
            allowed-methods: '*'
            allowed-headers: '*'
            allow-credentials: true
            max-age: 3600
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: project-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/projects/**
        - id: admin-user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/admin/users/**
        - id: admin-project-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/admin/**
        - id: generator-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/generator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info