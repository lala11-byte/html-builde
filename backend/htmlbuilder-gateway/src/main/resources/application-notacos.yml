server:
  port: 8080

spring:
  application:
    name: htmlbuilder-gateway-service
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: project-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/projects/**
        - id: generator-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/generator/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
